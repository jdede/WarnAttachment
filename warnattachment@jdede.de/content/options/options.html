<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="stylesheet" href="options.css"/>
    <script src="options.js" defer></script>
  </head>

  <body class="option-page">
    <form>
      <header class="page-head">
        <img src="../../icons/icon64.png" alt="" width="40" height="40"/>
        <h1 i18n-text="options.title"></h1>
      </header>

      <!-- Warn -->
      <section class="card card-warn">
        <div class="card-head">
          <span class="badge" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 3 2 21h20L12 3z"/><path d="M12 10v5M12 18h.01"/></svg>
          </span>
          <label for="warn-input" i18n-text="options.warn.title"></label>
          <span class="count" id="warn-count"></span>
        </div>
        <textarea id="warnattachment-warning" hidden></textarea>
        <div class="tags" id="warn-tags">
          <input type="text" class="tag-input" id="warn-input" spellcheck="false" autocomplete="off" placeholder="+ EXT"/>
        </div>
        <p class="hint" i18n-text="options.warn.desc"></p>

        <div class="field">
          <label for="warnattachment-user-warn-message" i18n-text="options.warn.user.title"></label>
          <input type="text" id="warnattachment-user-warn-message" i18n-placeholder="options.warn.user.desc"/>
        </div>
      </section>

      <!-- Block -->
      <section class="card card-block">
        <div class="card-head">
          <span class="badge" aria-hidden="true">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/></svg>
          </span>
          <label for="block-input" i18n-text="options.blocked.title"></label>
          <span class="count" id="block-count"></span>
        </div>
        <textarea id="warnattachment-blocking" hidden></textarea>
        <div class="tags" id="block-tags">
          <input type="text" class="tag-input" id="block-input" spellcheck="false" autocomplete="off" placeholder="+ EXT"/>
        </div>
        <p class="hint" i18n-text="options.blocked.desc"></p>

        <div class="field">
          <label for="warnattachment-user-blocked-message" i18n-text="options.blocked.user.title"></label>
          <input type="text" id="warnattachment-user-blocked-message" i18n-placeholder="options.blocked.user.desc"/>
        </div>
      </section>

      <div class="actions">
        <div id="infobox" role="status" aria-live="polite"></div>
        <input type="button" class="btn btn-ghost" id="warnattachment-reset-button" i18n-value="options.resetsettings"/>
        <input type="submit" class="btn btn-primary" i18n-value="options.savesettings"/>
      </div>
    </form>

    <footer class="page-foot">
      <a href="https://github.com/jdede/WarnAttachment" i18n-text="options.info.text.link.github"></a>
      <span aria-hidden="true">·</span>
      <a href="https://github.com/jdede/WarnAttachment/blob/master/LICENSE" i18n-text="options.info.text.link.license"></a>
    </footer>
  </body>
</html>
